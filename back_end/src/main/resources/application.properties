# ==============================
# CARGA DE VARIABLES DE ENTORNO (.env)
# ==============================
# Mecanismo nativo de Spring Boot (2.4+), sin dependencias externas.
# "optional:" permite que la app arranque igual si el archivo no existe
# (ej. en el servidor real, donde las variables se configuran directo
# en el entorno del sistema operativo, sin necesidad de este archivo).
spring.config.import=optional:file:.env[.properties]

# ==============================
# SERVIDOR
# ==============================
spring.application.name=sigma_te
server.port=${PORT:8080}

# ==============================
# BASE DE DATOS
# ==============================
# GUÍA DESPLIEGUE: en el servidor real, configura esta variable en el
# panel de entorno del hosting (no necesitas el archivo .env allá) y
# borra el valor de respaldo de aquí (todo lo que sigue a ":"),
# dejando solo ${DB_URL} sin default.
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-bold-snow-avetq5z1-pooler.c-11.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}


# GUÍA DESPLIEGUE: en el servidor real, configura esta variable en el
# panel de entorno del hosting (no necesitas el archivo .env allá) y
# borra el valor de respaldo de aquí (todo lo que sigue a ":"),
# dejando solo ${DB_USERNAME} sin default.
spring.datasource.username=${DB_USERNAME:neondb_owner}


# GUÍA DESPLIEGUE: en el servidor real, configura esta variable en el
# panel de entorno del hosting (no necesitas el archivo .env allá) y
# borra el valor de respaldo de aquí (todo lo que sigue a ":"),
# dejando solo ${DB_PASSWORD} sin default.
spring.datasource.password=${DB_PASSWORD:npg_yCdjMDtoW64l}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# SEGURIDAD JWT
# ==============================
# GUÍA DESPLIEGUE: en el servidor real, configura esta variable en el
# panel de entorno del hosting (no necesitas el archivo .env allá) y
# borra el valor de respaldo de aquí (todo lo que sigue a ":"),
# dejando solo ${JWT_SECRET} sin default.
jwt.secret=${JWT_SECRET:cambia-esto-por-una-clave-larga-y-aleatoria-de-al-menos-32-caracteres_1234}
jwt.expiration=86400000

# ==============================
# JPA/HIBERNATE
# ==============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# logging.level.org.springframework.security=DEBUG

# ==============================
# CORS/OTROS
# ==============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8085,http://127.0.0.1:8085,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173,http://localhost:8080}
# Clave maestra para reseteo de emergencia
security.emergencia.clave=123456789
