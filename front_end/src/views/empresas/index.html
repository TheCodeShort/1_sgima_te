<div class="view-page" data-view="empresas">
<main class="flex-1 flex flex-col h-screen overflow-hidden">

<!-- Canvas -->
<div class="flex-1 overflow-y-auto p-4 md:p-margin-desktop bg-background">

  <!-- Tabs -->
  <div class="flex items-center gap-6 border-b border-outline-variant mb-6">
    <button type="button" class="pb-3 px-1 text-body-md font-body-md font-semibold text-primary border-b-2 border-primary">
      Empresas
    </button>
  </div>

  <!-- Breadcrumb -->
  <div class="flex items-center gap-2 mb-6">
    <span class="material-symbols-outlined text-[20px] text-on-surface-variant">business</span>
    <span class="text-body-md font-body-md text-on-surface-variant">Empresas</span>
  </div>

  <!-- Page Header -->
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
    <div>
      <h2 class="text-display-id font-display-id text-on-background mb-1">Empresas registradas</h2>
      <p class="text-body-md font-body-md text-on-surface-variant max-w-2xl">
        Se registran las empresas que adquirieron el servicio de SIGMA-TE.
      </p>
    </div>
    <button id="btn-nueva-empresa" class="bg-inverse-primary text-on-primary hover:bg-primary-container hover:text-on-primary-container focus:ring-2 focus:ring-offset-2 focus:ring-offset-background focus:ring-primary transition-colors py-2 px-4 rounded-lg flex items-center justify-center gap-2 whitespace-nowrap shadow-sm">
      <span class="material-symbols-outlined text-[18px]">add</span>
      <span class="text-body-md font-body-md font-semibold">Nueva Empresa</span>
    </button>
  </div>

  <!-- Filters / Search Bar -->
  <div class="bg-surface-container-low border border-outline-variant rounded-lg p-3 mb-4 flex gap-3 items-center">
    <div class="flex-1 relative">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
      <input id="buscador-empresas" class="w-full bg-surface-base border border-outline-variant rounded focus:border-primary focus:ring-0 text-body-sm font-body-sm text-on-surface pl-9 py-1.5 placeholder-on-surface-variant/50" placeholder="Buscar por nombre de empresa..." type="text"/>
    </div>
  </div>

  <!-- Data Table Container -->
  <div class="bg-surface-card border border-outline-variant rounded-xl overflow-x-auto shadow-sm max-h-[640px] overflow-y-auto">
    <table class="w-full text-left border-collapse">
      <thead class="bg-surface-container-high border-b border-outline-variant text-label-caps font-label-caps text-on-surface-variant sticky top-0 z-10">
        <tr>
          <th class="px-4 py-3 font-semibold">Nombre de la Empresa</th>
          <th class="px-4 py-3 font-semibold">Estado</th>
          <th class="px-4 py-3 font-semibold">Fecha de Creación</th>
          <th class="px-4 py-3 font-semibold text-right">Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-empresas-body" class="text-data-table font-data-table text-on-surface divide-y divide-outline-variant/30">
        <tr>
          <td colspan="4" class="px-4 py-8 text-center text-on-surface-variant">
            Cargando empresas...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
</main>

<!-- Modal: Nueva Empresa -->
<div id="modal-empresa" style="display: none;" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4" aria-hidden="true" role="dialog" aria-labelledby="modal-empresa-titulo">
  <div class="bg-surface-card border border-outline-variant rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
    <div class="bg-surface-container-high border-b border-outline-variant px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-[22px]">business</span>
        <h3 id="modal-empresa-titulo" class="text-headline-sm font-headline-sm font-semibold text-on-surface">Nueva Empresa</h3>
      </div>
      <button id="btn-cerrar-modal-empresa" type="button" class="text-on-surface-variant hover:text-on-surface p-1 rounded-lg hover:bg-surface-container-highest transition-colors" aria-label="Cerrar modal">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>

    <form id="form-empresa" class="p-6 space-y-4">

      <!-- Barra de progreso del wizard -->
      <div class="mb-2">
        <div class="flex items-center justify-between mb-2">
          <span class="text-status-micro font-status-micro text-on-surface-variant" data-wizard-contador>1/2</span>
        </div>
        <div class="w-full h-1.5 bg-surface-container-high rounded-full overflow-hidden">
          <div class="h-full bg-primary transition-all duration-300" data-wizard-barra style="width: 50%;"></div>
        </div>
      </div>

      <!-- Paso 1: Datos de la empresa y su administrador -->
      <div data-wizard-paso="1">
        <div>
          <label for="empresa-nombre" class="block text-body-sm font-body-sm font-medium text-on-surface mb-1">Nombre de la Empresa <span class="text-error">*</span></label>
          <input id="empresa-nombre" type="text" required placeholder="Ej: Textiles del Sur" class="w-full bg-surface-base border border-outline-variant rounded-lg px-3 py-2 text-body-md font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-on-surface-variant/40"/>
          <p id="error-empresa-nombre" style="display:none;" class="text-status-micro font-status-micro mt-1 text-error"></p>
        </div>
        <div class="mt-4">
          <label for="empresa-admin-nombre" class="block text-body-sm font-body-sm font-medium text-on-surface mb-1">Nombre del Administrador <span class="text-error">*</span></label>
          <input id="empresa-admin-nombre" type="text" required placeholder="Ej: María Gómez" class="w-full bg-surface-base border border-outline-variant rounded-lg px-3 py-2 text-body-md font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-on-surface-variant/40"/>
          <p id="error-empresa-admin-nombre" style="display:none;" class="text-status-micro font-status-micro mt-1 text-error"></p>
        </div>
        <div class="mt-4">
          <label for="empresa-admin-correo" class="block text-body-sm font-body-sm font-medium text-on-surface mb-1">Correo del Administrador <span class="text-error">*</span></label>
          <input id="empresa-admin-correo" type="email" required placeholder="correo@empresa.com" class="w-full bg-surface-base border border-outline-variant rounded-lg px-3 py-2 text-body-md font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-on-surface-variant/40"/>
          <p id="error-empresa-admin-correo" style="display:none;" class="text-status-micro font-status-micro mt-1 text-error"></p>
        </div>
        <div class="mt-4">
          <label for="empresa-admin-password" class="block text-body-sm font-body-sm font-medium text-on-surface mb-1">Contraseña Inicial <span class="text-error">*</span></label>
          <input id="empresa-admin-password" type="password" required placeholder="Mínimo 8 caracteres" class="w-full bg-surface-base border border-outline-variant rounded-lg px-3 py-2 text-body-md font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-on-surface-variant/40"/>
          <p id="error-empresa-admin-password" style="display:none;" class="text-status-micro font-status-micro mt-1 text-error"></p>
        </div>
      </div>

      <!-- Paso 2: Permisos habilitados para la empresa -->
      <div data-wizard-paso="2" style="display:none;">
        <label class="block text-body-sm font-body-sm font-medium text-on-surface mb-2">Permisos habilitados para esta empresa <span class="text-error">*</span></label>
        <div id="permisos-checkboxes-empresa" class="grid grid-cols-1 gap-2 max-h-48 overflow-y-auto border border-outline-variant rounded-lg p-3 bg-surface-base">
          <!-- Checkboxes cargados dinámicamente -->
        </div>
        <p id="error-empresa-permisos" style="display:none;" class="text-status-micro font-status-micro mt-2 text-error">
          Debes seleccionar al menos un permiso para la empresa.
        </p>
      </div>

      <div class="flex items-center justify-between gap-3 pt-4 border-t border-outline-variant/50">
        <button id="btn-cancelar-modal-empresa" type="button" class="px-4 py-2 rounded-lg border border-outline-variant text-on-surface-variant hover:bg-surface-container-highest transition-colors text-body-md font-body-md font-medium">Cancelar</button>
        <div class="flex items-center gap-2">
          <button type="button" data-wizard-atras class="px-4 py-2 rounded-lg border border-outline-variant text-on-surface hover:bg-surface-container-highest transition-colors text-body-md font-body-md font-medium" style="display:none;">Atrás</button>
          <button type="button" data-wizard-siguiente class="px-4 py-2 rounded-lg bg-inverse-primary text-on-primary hover:bg-primary-container hover:text-on-primary-container transition-colors text-body-md font-body-md font-semibold shadow-sm">Siguiente</button>
          <button type="button" data-wizard-finalizar class="px-4 py-2 rounded-lg bg-inverse-primary text-on-primary hover:bg-primary-container hover:text-on-primary-container transition-colors text-body-md font-body-md font-semibold shadow-sm" style="display:none;">Crear Empresa</button>
        </div>
      </div>
    </form>
  </div>
</div>

</div>
