<div class="view-page" data-view="registrar-falla">
<!-- Minimal Header (Task-Focused suppression of full nav) -->
<header class="h-topbar-height px-gutter flex items-center justify-between bg-surface border-b border-outline-variant sticky top-0 z-50 shadow-sm">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors group" data-action="volver"><span class="material-symbols-outlined text-[20px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span class="font-label-caps text-label-caps uppercase hidden sm:inline">Volver</span>
</button>
<!-- Offline Sync Status Indicator -->
<div class="flex items-center gap-2 bg-warning/10 border border-warning/30 px-3 py-1.5 rounded-full" title="Modo Offline Activo">
<span class="material-symbols-outlined text-[16px] text-warning" style="font-variation-settings: 'FILL' 1;">cloud_off</span>
<span class="font-status-micro text-status-micro text-warning uppercase tracking-widest">Sin conexión</span>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-container-low via-background to-background relative overflow-hidden">
<!-- Decorative Background Grid -->
<div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImdyaWQiIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTSAwIDQwIEwgNDAgNDAgTCA0MCAwIiBmaWxsPSJub25lIiBzdHJva2U9InJnYmEoMjU1LDI1NSwyNTUsMC4wMykiIHN0cm9rZS13aWR0aD0iMSIvPjwvcGF0dGVybj48L2RlZnM+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0idXJsKCNncmlkKSIvPjwvc3ZnPg==')] opacity-50 pointer-events-none"></div>
<!-- Form Card (Modal-like centered view) -->
<div class="w-full max-w-2xl bg-surface-card border border-outline-variant rounded-lg shadow-2xl relative z-10 overflow-hidden flex flex-col">
<!-- Card Header -->
<div class="px-6 py-5 border-b border-outline-variant bg-surface-container-low flex justify-between items-center">
<div>
<h1 class="font-display-id text-display-id text-primary">Registrar Falla</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Complete los detalles para generar una nueva orden de mantenimiento.</p>
</div>
<span class="material-symbols-outlined text-[32px] text-surface-variant" style="font-variation-settings: 'FILL' 1;">build_circle</span>
</div>
<!-- Form Body -->
<form class="p-6 flex flex-col gap-6">
<!-- System Auto-generated Info -->
<div class="flex flex-col sm:flex-row gap-4 bg-surface-container border border-outline-variant/50 rounded p-3">
<div class="flex-1">
<span class="font-status-micro text-status-micro text-on-surface-variant uppercase block mb-1">Fecha / Hora (Auto)</span>
<div class="flex items-center gap-2 text-on-surface font-data-table text-data-table">
<span class="material-symbols-outlined text-[16px] text-primary">schedule</span>
<span id="current-datetime">2023-10-27 14:30:00</span>
</div>
</div>
<div class="w-px bg-outline-variant/50 hidden sm:block"></div>
<div class="flex-1">
<span class="font-status-micro text-status-micro text-on-surface-variant uppercase block mb-1">ID Temporal</span>
<div class="flex items-center gap-2 text-on-surface font-data-table text-data-table">
<span class="material-symbols-outlined text-[16px] text-warning">tag</span>
<span>FL-PEND-092</span>
</div>
</div>
</div>
<!-- Equipo Selector -->
<div>
<label class="utilitarian-label" for="equipo">Equipo <span class="text-error">*</span></label>
<div class="relative">
<select class="utilitarian-input appearance-none pr-10 cursor-pointer" id="equipo" name="equipo" required="">
<option disabled="" selected="" value="">Seleccione un equipo afectado...</option>
<optgroup label="Sector A - Motores">
<option value="m1">Motor Principal M-101</option>
<option value="m2">Bomba de Refrigeración B-205</option>
</optgroup>
<optgroup label="Sector B - Cintas">
<option value="c1">Cinta Transportadora CT-01</option>
<option value="c2">Rodillo Tensor RT-44</option>
</optgroup>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Priority Selector -->
<div>
<label class="utilitarian-label">Prioridad <span class="text-error">*</span></label>
<div class="flex rounded shadow-sm">
<label class="flex-1 flex">
<input class="sr-only" name="prioridad" required="" type="radio" value="alta"/>
<div class="priority-btn priority-btn-alta flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">keyboard_double_arrow_up</span>
                                Alta
                            </div>
</label>
<label class="flex-1 flex">
<input class="sr-only" name="prioridad" type="radio" value="media"/>
<div class="priority-btn priority-btn-media border-l-0 border-r-0 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">drag_handle</span>
                                Media
                            </div>
</label>
<label class="flex-1 flex">
<input class="sr-only" name="prioridad" type="radio" value="baja"/>
<div class="priority-btn priority-btn-baja flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">keyboard_double_arrow_down</span>
                                Baja
                            </div>
</label>
</div>
</div>
<!-- Descripción -->
<div>
<label class="utilitarian-label" for="descripcion">Descripción del problema <span class="text-error">*</span></label>
<textarea class="utilitarian-input resize-y" id="descripcion" name="descripcion" placeholder="Describa el síntoma, ruido o comportamiento anómalo..." required="" rows="3"></textarea>
</div>
<!-- Observaciones -->
<div>
<label class="utilitarian-label" for="observaciones">Observaciones (Opcional)</label>
<textarea class="utilitarian-input resize-y text-on-surface-variant" id="observaciones" name="observaciones" placeholder="Condiciones del entorno, acciones inmediatas tomadas..." rows="2"></textarea>
</div>
</form>
<!-- Card Footer / Actions -->
<div class="px-6 py-4 border-t border-outline-variant bg-surface-container-lowest flex items-center justify-end gap-3">
<button class="px-4 py-2 rounded font-body-md font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors focus:ring-2 focus:ring-primary focus:outline-none" type="button">
                    Cancelar
                </button>
<button class="px-6 py-2 rounded font-body-md font-semibold bg-primary text-on-primary hover:bg-primary-fixed transition-colors flex items-center gap-2 focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-card focus:outline-none shadow-sm" type="submit">
<span class="material-symbols-outlined text-[18px]">save</span>
                    Registrar Falla
                </button>
</div>
</div>
</main>
</div>
