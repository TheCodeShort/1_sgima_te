<div class="absolute inset-0 bg-gradient-to-b from-background/80 via-background/95 to-background"></div>
</div>
<button aria-label="Cambiar tema" class="login-theme-toggle absolute top-6 right-6 z-20 p-2 rounded-full bg-surface-container hover:bg-surface-container-highest border border-outline-variant text-on-surface transition-colors flex items-center justify-center" id="themeToggle" type="button">
<span class="material-symbols-outlined" id="themeIcon">light_mode</span>
</button>
<main class="login-card relative z-10 w-full max-w-[440px] mx-4 p-8 bg-surface-container-low rounded-xl border border-outline-variant shadow-2xl flex flex-col gap-6">
<header class="flex flex-col items-center justify-center text-center gap-2">
<div class="w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center border border-outline-variant mb-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">engineering</span>
</div>
<h1 class="font-display-id text-display-id text-primary tracking-tight">SIGMA-TE</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sistema de Gestión de Mantenimiento</p>
</header>
<div aria-live="polite" class="login-alert" hidden id="login-alert" role="alert"></div>
<form class="flex flex-col gap-5" id="login-form" novalidate>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface" for="correo">Correo</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-sm">person</span>
<input autocomplete="email" class="w-full bg-surface-card border border-outline-variant text-on-surface font-body-md text-body-md rounded py-2.5 pl-10 pr-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" id="correo" name="correo" placeholder="Ingrese su correo" required type="email"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface" for="password">Contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-sm">lock</span>
<input autocomplete="current-password" class="w-full bg-surface-card border border-outline-variant text-on-surface font-body-md text-body-md rounded py-2.5 pl-10 pr-11 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" id="password" name="password" placeholder="Ingrese su contraseña" required type="password"/>
<button aria-label="Mostrar contraseña" class="login-password-toggle" id="toggle-password" type="button">
<span class="material-symbols-outlined text-sm" id="toggle-password-icon">visibility</span>
</button>
</div>
</div>
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded-sm border-outline-variant bg-surface-card text-primary focus:ring-primary focus:ring-offset-background focus:ring-offset-2 transition-colors cursor-pointer" id="remember-me" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Recordar usuario</span>
</label>
<button class="w-full mt-2 bg-primary text-on-primary font-headline-md text-headline-md py-3 px-4 rounded-lg hover:bg-primary-fixed transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background flex justify-center items-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed" id="login-submit" type="submit">
<span id="login-submit-label">Iniciar sesión</span>
<span class="material-symbols-outlined text-sm" id="login-submit-icon">login</span>
</button>
</form>
