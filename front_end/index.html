<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SIGMA-TE — Sistema de Gestión de Mantenimiento Industrial">
  <title>SIGMA-TE — Gestión de Mantenimiento</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <script>
    (function() {
      const saved = localStorage.getItem('theme') || localStorage.getItem('sigma_theme');
      const prefersDark = saved ? saved === 'dark' : true;
      const theme = prefersDark ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.toggle('dark', prefersDark);
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="assets/js/font-loader.js"></script>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/js/tailwind-config.js"></script>

  <link rel="stylesheet" href="assets/css/global.css">
</head>
<body class="bg-background text-on-background font-body-md antialiased">

  <button id="mobile-nav-toggle" type="button" aria-label="Abrir menú">
    <span class="material-symbols-outlined">menu</span>
  </button>
  <div id="sidebar-overlay" aria-hidden="true"></div>

  <div id="app-shell" class="layout-fullscreen">
    <!-- Sidebar global -->
    <aside id="global-sidebar" aria-label="Navegación principal">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">
          <span class="material-symbols-outlined fill">engineering</span>
        </div>
        <div>
          <div class="text-headline-md font-headline-md text-primary tracking-tight">SIGMA-TE</div>
          <div class="text-status-micro font-status-micro text-on-surface-variant uppercase">Gestión Industrial</div>
        </div>
      </div>

      <p id="sidebar-user-label" class="sidebar-user" hidden></p>

      <nav class="sidebar-nav">
        <span id="nav-section-acceso" class="nav-section-label">Acceso</span>
        <button id="nav-btn-login" type="button" class="nav-link" data-route="iniciar-sesion">
          <span class="material-symbols-outlined text-[20px]">login</span>
          Iniciar Sesión
        </button>

        <div id="mi-panel-placa" class="flex items-center gap-3 px-3 py-2.5 mb-1">
          <span class="material-symbols-outlined text-[20px] text-on-surface-variant">badge</span>
          <div>
            <div class="text-status-micro font-status-micro text-on-surface-variant uppercase">Mi Panel</div>
            <div id="mi-panel-rol-nombre" class="text-body-sm font-body-sm font-semibold text-on-surface">Cargando...</div>
          </div>
        </div>

        <span class="nav-section-label">Operaciones</span>
        <button type="button" class="nav-link" data-route="equipos" data-modulo-permiso="ver_equipos">
          <span class="material-symbols-outlined text-[20px]">settings_suggest</span>
          Equipos
        </button>
        <button type="button" class="nav-link" data-route="detalle-equipo" data-modulo-permiso="ver_equipos">
          <span class="material-symbols-outlined text-[20px]">info</span>
          Detalles del Equipo
        </button>
        <button type="button" class="nav-link" data-route="registrar-falla" data-modulo-permiso="registrar_falla">
          <span class="material-symbols-outlined text-[20px]">warning</span>
          Registrar Falla
        </button>
        <button type="button" class="nav-link" data-route="registrar-mantenimiento" data-modulo-permiso="registrar_mantenimiento">
          <span class="material-symbols-outlined text-[20px]">build_circle</span>
          Registrar Mantenimiento
        </button>
        <button type="button" class="nav-link" data-route="cargar-evidencia" data-modulo-permiso="cargar_evidencia">
          <span class="material-symbols-outlined text-[20px]">cloud_upload</span>
          Cargar Evidencia
        </button>

        <span id="nav-section-admin" class="nav-section-label">Administración</span>
        <button type="button" class="nav-link" data-route="empresas">
          <span class="material-symbols-outlined text-[20px]">business</span>
          Empresas
        </button>
        <button type="button" class="nav-link" data-route="gestion-usuarios-roles" data-modulo-permiso="gestionar_usuarios,gestionar_roles">
          <span class="material-symbols-outlined text-[20px]">group</span>
          Usuarios y Roles
        </button>
        <button type="button" class="nav-link" data-route="estado-sincronizacion">
          <span class="material-symbols-outlined text-[20px]">cloud_sync</span>
          Sincronización
        </button>
      </nav>

      <div class="sidebar-footer">
        <button type="button" id="global-theme-toggle" class="nav-link" aria-label="Cambiar tema">
          <span class="material-symbols-outlined text-[20px]" id="global-theme-icon">light_mode</span>
          Cambiar Tema
        </button>
        <button type="button" class="nav-link logout" data-route="iniciar-sesion" id="btn-logout">
          <span class="material-symbols-outlined text-[20px]">logout</span>
          Cerrar Sesión
        </button>
      </div>
    </aside>

    <!-- Área de contenido principal: topbar global + vistas dinámicas -->
    <div id="app-content-area">

      <!-- Topbar global compartida -->
      <header id="global-topbar" class="bg-surface dark:bg-surface text-primary dark:text-primary bg-surface-container-high border-b border-outline-variant sticky top-0 flex items-center justify-between px-gutter h-topbar-height w-full flex-shrink-0">
        <!-- Mobile Brand -->
        <div class="md:hidden text-headline-lg font-headline-lg font-bold text-primary tracking-tight">
          SIGMA-TE
        </div>

        <!-- Desktop context label -->
        <div class="hidden md:flex items-center gap-2 text-body-md font-body-md text-on-surface-variant">
          <span class="text-on-surface font-medium">SIGMA-TE</span>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-4">
          <!-- Sync Status Indicator -->
          <div class="flex items-center gap-1.5 px-2 py-1 rounded bg-surface-container-low border border-outline-variant/50" title="Estado del sistema">
            <span class="material-symbols-outlined text-[14px] text-success fill">sync</span>
            <span class="text-status-micro font-status-micro text-on-surface-variant uppercase">Sincronizado</span>
          </div>

          <div class="flex items-center gap-2 text-on-surface-variant">
            <button class="p-2 rounded-full hover:bg-surface-container-highest transition-colors relative" aria-label="Notificaciones">
              <span class="material-symbols-outlined">notifications</span>
              <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-error rounded-full"></span>
            </button>
          </div>

          <!-- Avatar con dropdown -->
          <div class="relative">
            <button id="btn-avatar-menu" class="w-8 h-8 rounded-full bg-secondary-container border border-outline-variant overflow-hidden cursor-pointer flex items-center justify-center" aria-label="Menú de usuario" aria-expanded="false" aria-haspopup="true">
              <span class="material-symbols-outlined text-on-surface-variant">person</span>
            </button>
            <div id="avatar-dropdown-menu" style="display:none;" class="absolute right-0 mt-2 w-48 bg-surface-card border border-outline-variant rounded-lg shadow-2xl z-100 overflow-hidden" role="menu">
              <button id="btn-ir-mi-perfil" type="button" class="w-full text-left px-4 py-2.5 text-body-sm font-body-sm text-on-surface hover:bg-surface-container-highest transition-colors flex items-center gap-2" role="menuitem">
                <span class="material-symbols-outlined text-[18px]">account_circle</span>
                Mi Perfil
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Contenedor dinámico de vistas -->
      <div id="app-root" role="main"></div>

    </div><!-- /#app-content-area -->
  </div>

  <div id="sigma-toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="src/services/apiConfig.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="src/services/authService.js"></script>
  <script src="src/services/equipoService.js"></script>
  <script src="src/services/fallaService.js"></script>
  <script src="src/services/rolService.js"></script>
  <script src="src/services/permisoService.js"></script>
  <script src="src/services/rolPermisoService.js"></script>
  <script src="src/services/usuarioService.js"></script>
  <script src="src/services/empresaService.js"></script>
  <script src="assets/js/view-helpers.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/avatar-menu.js"></script>
<script src="assets/js/wizard-helper.js"></script>
  <script src="assets/js/popover-confirmar.js"></script>
  <script src="assets/js/validador-helper.js"></script>
</body>
</html>
