<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SIGMA-TE — Sistema de Gestión de Mantenimiento Industrial">
  <title>SIGMA-TE — Gestión de Mantenimiento</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <script>
    (function() {
      const saved = localStorage.getItem('theme') || localStorage.getItem('sigma_theme');
      const prefersDark = saved ? saved === 'dark' : true;
      const theme = prefersDark ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.toggle('dark', prefersDark);
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/js/tailwind-config.js"></script>

  <link rel="stylesheet" href="assets/css/global.css">
</head>
<body class="bg-background text-on-background font-body-md antialiased">

  <button id="mobile-nav-toggle" type="button" aria-label="Abrir menú">
    <span class="material-symbols-outlined">menu</span>
  </button>
  <div id="sidebar-overlay" aria-hidden="true"></div>

  <div id="app-shell" class="layout-fullscreen">
    <!-- Sidebar global -->
    <aside id="global-sidebar" aria-label="Navegación principal">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">
          <span class="material-symbols-outlined fill">engineering</span>
        </div>
        <div>
          <div class="text-headline-md font-headline-md text-primary tracking-tight">SIGMA-TE</div>
          <div class="text-status-micro font-status-micro text-on-surface-variant uppercase">Gestión Industrial</div>
        </div>
      </div>

      <p id="sidebar-user-label" class="sidebar-user" hidden></p>

      <nav class="sidebar-nav">
        <span id="nav-section-acceso" class="nav-section-label">Acceso</span>
        <button id="nav-btn-login" type="button" class="nav-link" data-route="iniciar-sesion">
          <span class="material-symbols-outlined text-[20px]">login</span>
          Iniciar Sesión
        </button>

        <span id="nav-section-panels" class="nav-section-label">Paneles por Rol</span>
        <button type="button" class="nav-link" data-route="panel-administrador">
          <span class="material-symbols-outlined text-[20px]">admin_panel_settings</span>
          Administrador
        </button>
        <button type="button" class="nav-link" data-route="panel-auditor">
          <span class="material-symbols-outlined text-[20px]">fact_check</span>
          Auditor
        </button>
        <button type="button" class="nav-link" data-route="panel-supervisor">
          <span class="material-symbols-outlined text-[20px]">supervisor_account</span>
          Supervisor
        </button>
        <button type="button" class="nav-link" data-route="panel-tecnico">
          <span class="material-symbols-outlined text-[20px]">build</span>
          Técnico
        </button>
        <button type="button" class="nav-link" data-route="panel-operario">
          <span class="material-symbols-outlined text-[20px]">precision_manufacturing</span>
          Operario
        </button>

        <span class="nav-section-label">Operaciones</span>
        <button type="button" class="nav-link" data-route="equipos">
          <span class="material-symbols-outlined text-[20px]">settings_suggest</span>
          Equipos
        </button>
        <button type="button" class="nav-link" data-route="detalle-equipo">
          <span class="material-symbols-outlined text-[20px]">info</span>
          Detalle del Equipo
        </button>
        <button type="button" class="nav-link" data-route="registrar-falla">
          <span class="material-symbols-outlined text-[20px]">warning</span>
          Registrar Falla
        </button>
        <button type="button" class="nav-link" data-route="registrar-mantenimiento">
          <span class="material-symbols-outlined text-[20px]">build_circle</span>
          Registrar Mantenimiento
        </button>
        <button type="button" class="nav-link" data-route="cargar-evidencia">
          <span class="material-symbols-outlined text-[20px]">cloud_upload</span>
          Cargar Evidencia
        </button>

        <span id="nav-section-admin" class="nav-section-label">Administración</span>
        <button type="button" class="nav-link" data-route="gestion-usuarios-roles">
          <span class="material-symbols-outlined text-[20px]">group</span>
          Usuarios y Roles
        </button>
        <button type="button" class="nav-link" data-route="estado-sincronizacion">
          <span class="material-symbols-outlined text-[20px]">cloud_sync</span>
          Sincronización
        </button>
      </nav>

      <div class="sidebar-footer">
        <button type="button" id="global-theme-toggle" class="nav-link" aria-label="Cambiar tema">
          <span class="material-symbols-outlined text-[20px]" id="global-theme-icon">light_mode</span>
          Cambiar Tema
        </button>
        <button type="button" class="nav-link logout" data-route="iniciar-sesion" id="btn-logout">
          <span class="material-symbols-outlined text-[20px]">logout</span>
          Cerrar Sesión
        </button>
      </div>
    </aside>

    <!-- Contenedor dinámico de vistas -->
    <div id="app-root" role="main"></div>
  </div>

  <div id="sigma-toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="src/services/apiConfig.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="src/services/authService.js"></script>
  <script src="src/services/equipoService.js"></script>
  <script src="src/services/fallaService.js"></script>
  <script src="src/services/rolService.js"></script>
  <script src="assets/js/view-helpers.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
